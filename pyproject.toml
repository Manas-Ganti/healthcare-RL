[project]
name = "dxenv"
version = "0.1.0"
description = "A diagnostic RLVR environment over synthetic patient records"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.98",
    "ruff>=0.4",
    "mypy>=1.9",
    "scikit-learn>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dxenv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full-corpus or toy-MDP exhaustive tests; run nightly and before every gate",
    "corpus: requires a generated corpus on disk",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["dxenv", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "ARG", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "ARG001"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["dxenv"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "yaml.*"]
ignore_missing_imports = true
