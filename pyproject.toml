[project]
name = "dxenv"
version = "0.1.0"
description = "A diagnostic RLVR environment over synthetic patient records"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.98",
    "ruff>=0.4",
    "mypy>=1.9",
    "scikit-learn>=1.4",
    # Validates the emitted action grammar against the JSON Schema spec. The grammar is
    # enforced in production by vLLM's own engine; this is how the fast suite checks that
    # the schema we hand it actually rejects an off-menu action.
    "jsonschema>=4.21",
]

# GPU extras, deliberately SPLIT IN TWO. They cannot be installed together.
#
# vLLM pins transformers near 4.51; TRL needs >=4.56. Crossing them fails at import,
# ~20 minutes into a job holding a full node:
#
#     ImportError: cannot import name 'is_trackio_available' from 'transformers'
#     RuntimeError: Failed to import trl.trainer.sft_trainer
#
# That is a documented, already-paid-for failure on this cluster (docs/arc/runbook.md 3).
# Do not try to unify them.
#
# The split works because the two paths need different things: rollouts and GRPO need
# vLLM plus raw torch/peft for the gradient step, and only SFT needs TRL's SFTTrainer.
#
#   infer  -- rollouts, Gate B, gpu_smoke, and the GRPO loop  -> .venv
#   train  -- SFT only (policy.sft.train_lora)                -> .venv-train
#
# Nothing above dxenv/policy/llm.py and dxenv/train/grpo.py imports either, and both
# import lazily, so the whole invariant suite runs on a laptop with neither installed.
infer = [
    "torch>=2.4",
    "vllm>=0.6",
    "peft>=0.12",
    "accelerate>=0.33",
    "transformers",       # deliberately unpinned: let vLLM's resolver choose
]

train = [
    "torch>=2.4",
    "transformers>=4.56",
    "trl>=0.11",
    "peft>=0.12",
    "accelerate>=0.33",
    "datasets>=2.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dxenv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fast suite by default: unit + invariants on the 100-patient fixture, target < 60s.
# The corpus-wide sweeps and the toy-MDP policy-invariance check are marked slow and run
# nightly and before every gate:  pytest -m slow
addopts = "-m 'not slow'"
markers = [
    "slow: full-corpus or toy-MDP exhaustive tests; run nightly and before every gate",
    "corpus: requires a generated corpus on disk",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["dxenv", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "ARG", "PL", "RUF"]
ignore = [
    "PLR0913",  # long signatures are the price of passing config explicitly
    "PLR0917",  # (CLAUDE.md 3: no module-level config reads, so config arrives as args)
    "PLR2004",
    # Invariant-violation exceptions subclass AssertionError and are named for what
    # broke (CeilingViolation, EntropyCollapse), not with an -Error suffix. The name is
    # what appears in a halted training run; readability wins here.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# Tests import inside functions on purpose: it keeps module import time off the fast
# suite and lets a test import the very module it is asserting about.
"tests/*" = ["PLR2004", "ARG001", "PLC0415", "PLR0917", "PT018", "PLR0915"]
# Composition sites: score_trajectory and the catalog loader are long because they
# validate every field explicitly rather than trusting the input.
"dxenv/reward/engine.py" = ["PLR0912", "PLR0915"]
"dxenv/env/catalog.py" = ["PLR0912"]
"dxenv/env/obs_model.py" = ["PLR0912"]
# The training loop and the SFT/GRPO entry points are long because each step is spelled
# out -- sample, score, assert, persist, update -- rather than hidden behind a framework.
"dxenv/train/grpo.py" = ["PLR0912", "PLR0915", "PLC0415"]
"dxenv/policy/sft.py" = ["PLC0415"]
"dxenv/policy/llm.py" = ["PLC0415"]
"dxenv/policy/decoding.py" = ["PLC0415"]
"dxenv/data/store.py" = ["PLC0415"]
"scripts/*" = ["PLC0415", "PLR0915", "PLR0912"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["dxenv"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = [
    "scipy.*", "sklearn.*", "yaml.*",
    # The GPU extra. Every import of these is lazy and inside a function; type-checking
    # dxenv/ must not require a CUDA host to have been provisioned first.
    "torch.*", "transformers.*", "peft.*", "trl.*", "datasets.*", "vllm.*",
]
ignore_missing_imports = true
