# Global catalog: analytes (what a result IS) and orderable tests (what an agent ASKS FOR).
#
# The split matters. An orderable test is a purchasing decision; an analyte is a random
# variable. Panels share analytes with singleton orders, so ordering CMP after BMP must
# not re-charge for or re-sample sodium -- see episode dedup and I4.
#
# Every analyte here gets a distribution for EVERY condition in the taxonomy (I4). The
# cross product is materialised at build time in obs_model.py; there are no runtime
# fallbacks and no "unavailable" result.
#
# `healthy` is the reference distribution used for conditions with no specific override.
# It is NOT a default-on-lookup-miss -- see obs_model.build_observation_model.

