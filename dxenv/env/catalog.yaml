# Auto-revealed at t=0: demographics-adjacent signal the agent gets for free.
# Same schema as `analytes`, but NOT orderable -- they are never on the action menu and
# are exempt from the "reachable by some test" check. They are still full members of the
# observation model, so every condition specifies (or inherits) a distribution for each.
vitals:
  - {key: heart_rate, display: "Heart rate", kind: quantitative, unit: "bpm", ref_low: 60.0, ref_high: 100.0, bounds: [20.0, 240.0], healthy: {mean: 76.0, sd: 10.0}}
  - {key: systolic_bp, display: "Systolic blood pressure", kind: quantitative, unit: "mmHg", ref_low: 90.0, ref_high: 130.0, bounds: [40.0, 280.0], healthy: {mean: 120.0, sd: 11.0}}
  - {key: diastolic_bp, display: "Diastolic blood pressure", kind: quantitative, unit: "mmHg", ref_low: 60.0, ref_high: 85.0, bounds: [20.0, 160.0], healthy: {mean: 75.0, sd: 8.0}}
  - {key: respiratory_rate, display: "Respiratory rate", kind: quantitative, unit: "breaths/min", ref_low: 12.0, ref_high: 20.0, bounds: [4.0, 70.0], healthy: {mean: 15.0, sd: 2.0}}
  - {key: temperature, display: "Temperature", kind: quantitative, unit: "degC", ref_low: 36.1, ref_high: 37.8, bounds: [30.0, 43.5], healthy: {mean: 36.8, sd: 0.3}}
  - {key: spo2, display: "Oxygen saturation", kind: quantitative, unit: "%", ref_low: 94.0, ref_high: 100.0, bounds: [50.0, 100.0], healthy: {mean: 97.5, sd: 1.2}}
  - {key: bmi, display: "Body mass index", kind: quantitative, unit: "kg/m2", ref_low: 18.5, ref_high: 25.0, bounds: [12.0, 70.0], healthy: {mean: 26.5, sd: 4.5}}
  - {key: pain_score, display: "Pain score", kind: quantitative, unit: "0-10", ref_low: 0.0, ref_high: 3.0, bounds: [0.0, 10.0], healthy: {mean: 1.0, sd: 1.0}}
  - {key: presenting_complaint, display: "Presenting complaint", kind: categorical, values: [chest_pain, dyspnea, cough, fever, abdominal_pain, headache, dizziness, syncope, palpitations, nausea_vomiting, diarrhea, dysuria, lumbar_pain, joint_pain, rash, focal_weakness, confusion, fatigue, weight_loss, bleeding, sore_throat, leg_swelling, seizure_event, mood_disturbance, vision_change, numbness_tingling, trauma_fall, exposure_or_ingestion, routine_review], healthy: {routine_review: 0.55, fatigue: 0.15, lumbar_pain: 0.08, headache: 0.07, joint_pain: 0.05, cough: 0.04, abdominal_pain: 0.03, dizziness: 0.03}}
