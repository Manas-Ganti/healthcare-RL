# Orderable actions. `analytes` lists what the order returns. Panels overlap with
# singletons on purpose -- dedup is tested (test_dedup_does_not_double_charge).
tests:
  - {key: cbc, display: "Complete blood count with differential", category: lab, analytes: [hemoglobin, mcv, wbc, neutrophil_pct, lymphocyte_pct, platelets]}
  - {key: hemoglobin_only, display: "Hemoglobin", category: lab, analytes: [hemoglobin]}
  - {key: platelet_count, display: "Platelet count", category: lab, analytes: [platelets]}
  - {key: reticulocyte_count, display: "Reticulocyte count", category: lab, analytes: [reticulocyte_pct]}
  - {key: peripheral_smear, display: "Peripheral blood smear", category: lab, analytes: [peripheral_smear]}
  - {key: coagulation_panel, display: "Coagulation panel", category: lab, analytes: [inr, ptt]}
