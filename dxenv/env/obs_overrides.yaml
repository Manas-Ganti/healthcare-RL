# p(result | condition) overrides, keyed condition -> analyte -> distribution.
#
# Any (condition, analyte) pair NOT listed here inherits the analyte's `healthy`
# distribution from catalog.yaml. That inheritance happens once, at build time, in
# obs_model.build_observation_model(), which materialises the FULL cross product. There
# is no runtime fallback: a lookup miss in the built model raises. See I4.
#
# THESE ARE SIMULATION PARAMETERS, NOT CLINICAL REFERENCE VALUES. They are chosen so the
# environment has learnable, non-degenerate structure -- separable enough that tests are
# worth ordering, overlapping enough that a single test rarely settles the question. Do
# not read them as guidance, and do not "improve" one toward realism without checking
# what it does to the Bayes ceiling and to Gate A's T-V margin.
#
# Quantitative: {mean, sd} of a normal truncated to the analyte's bounds.
# Categorical:  explicit probability per declared result value; must sum to 1.

