# Price list for orderable tests, in abstract cost units.
#
# Read by BOTH env/episode.py (for the budget ledger -- what an order costs to place) and
# reward/costs.py (for the reward term -- what an order costs you). One file, so the two
# cannot drift; env/ does not import reward/ and vice versa.
#
# These are simulation parameters. The relative ordering across categories is what
# matters -- bedside < lab < micro < imaging < procedure -- because it is the ordering
# that shapes which investigations an agent learns to reach for first.
#
# test_cost_table_covers_menu asserts EVERY orderable action has an entry. A missing
# entry raises; it does not default to zero, because a free test is an infinite-value
# test and the agent will find it.
version: 1
default: null   # explicitly no default. A miss is an error, not a zero.

