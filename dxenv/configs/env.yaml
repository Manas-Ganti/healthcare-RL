# Environment configuration. Pinned by hash into every run and every stored trajectory.
version: 1

episode:
  max_turns: 20
  # Repeat orders are deduped: the second order of a test costs nothing and returns the
  # cached result. Without this the agent finds the cheapest test and spams it.
  dedup_repeat_orders: true
  # Budget is exposed in the observation and decrements as tests are ordered.
  expose_remaining_budget: true

budget:
  # Budget-conditioned: B ~ p(B) per episode, so ONE policy spans the whole cost-accuracy
  # frontier and eval sweeps B to trace it.
  #
  # Shape choice (CLAUDE.md 12 open decision, resolved here): a discrete mixture rather
  # than a continuous distribution, so eval can sweep exactly the support and the Pareto
  # points are directly comparable across runs. Weighted toward the middle because the
  # extremes teach degenerate policies -- at B=0 the only move is to guess the prior, and
  # at B=inf ordering everything is optimal.
  distribution: discrete_mixture
  support: [10, 25, 50, 100, 200]
  weights: [0.15, 0.25, 0.30, 0.20, 0.10]

observation:
  strict_allowlist: true
  # An unrecognised resource type RAISES rather than passing through. The allowlist fails
  # closed; that is what makes I2 a guarantee instead of a hope.
  scrub_display_strings: true
  # A lab value is fine; a display string reading "HbA1c - diabetes monitoring" is not.

curriculum:
  # single-condition -> comorbid, short horizon -> full budget. Both stop "order
  # everything" becoming a survival strategy while the model is still confused: at full
  # budget with a confused policy, exhaustive testing genuinely IS the best available
  # move, and the habit is stubborn once trained in.
  #
  # advance_criterion is mean episode reward over the stage's evaluation window. The
  # numbers sit a little above the vitals-only Bayes baseline (+0.56 on the 60-patient
  # reference sweep), so a stage is cleared by a policy that has learned to test
  # profitably rather than by one that has learned to guess well.
  stages:
    - {name: single_condition_short, comorbid: false, max_turns: 8, advance_criterion: 0.70}
    - {name: single_condition_full, comorbid: false, max_turns: 20, advance_criterion: 1.10}
    - {name: comorbid_full, comorbid: true, max_turns: 20, advance_criterion: 0.0}
