# Treatment appropriateness and contraindication rules.
#
# SIMULATION PARAMETERS, NOT CLINICAL GUIDANCE. These encode a coarse, internally
# consistent notion of "a reasonable thing to do for this condition" so that the
# treatment reward has structure. They are not a formulary and must never be presented
# as one.
#
# Scored twice (CLAUDE.md 7.5):
#   * against the DECLARED diagnosis  -> rewards coherence
#   * against the TRUE condition      -> rewards being right
# A lucky-correct treatment under a wrong diagnosis does not collect the second.
version: 1

# Full credit. Everything not listed for a condition scores zero unless it appears in
# `acceptable`, and `no_pharmacotherapy` is correct for conditions where doing nothing
# pharmacological IS the answer.
first_line:
  acute_myocardial_infarction: [aspirin, heparin_infusion, atorvastatin, metoprolol]
