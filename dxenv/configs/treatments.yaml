# Partial credit: defensible, not first choice.
acceptable_fraction: 0.4
acceptable:
  community_acquired_pneumonia: [levofloxacin, piperacillin_tazobactam]
  urinary_tract_infection: [amoxicillin_clavulanate, levofloxacin]
  cellulitis: [vancomycin_iv, trimethoprim_sulfamethoxazole]
  sepsis: [ceftriaxone, metronidazole]
  type_2_diabetes: [lisinopril, no_pharmacotherapy]
  essential_hypertension: [metoprolol, furosemide]
  atrial_fibrillation: [enoxaparin, heparin_infusion]
  migraine: [acetaminophen, morphine]
  gout: [prednisone]
  asthma_exacerbation: [magnesium_sulfate]
  acute_myocardial_infarction: [clopidogrel, nitroglycerin, morphine, supplemental_oxygen]

# Contraindications are asymmetric and large. A contraindicated prescription must score
# strictly WORSE than a suboptimal-but-safe one at every level of diagnostic accuracy --
# otherwise "shotgun everything plausible" dominates, and the shotgun includes the harm.
contraindications:
  allergy:
    # Prescribing a drug whose class is on the patient's allergy list. The list is
    # visible in the observation, so this is always avoidable.
    scale: 1.0
  renal:
    egfr_below: 30.0
    treatments: [metformin, nitrofurantoin, ibuprofen, enoxaparin, apixaban]
    scale: 1.0
  pregnancy:
    hcg_above: 25.0
    treatments: [lisinopril, losartan, sacubitril_valsartan, doxycycline, ibuprofen, methimazole, atorvastatin]
    scale: 1.0
  hyperkalemia:
    potassium_above: 5.5
    treatments: [lisinopril, losartan, sacubitril_valsartan]
    scale: 0.8
  bleeding:
    platelets_below: 50.0
    treatments: [thrombolysis, apixaban, enoxaparin, heparin_infusion, aspirin, ibuprofen]
    scale: 1.0
  interactions:
    # Prescribing BOTH of a pair in the same episode.
    - {pair: [thrombolysis, apixaban], scale: 1.0}
    - {pair: [thrombolysis, enoxaparin], scale: 1.0}
    - {pair: [heparin_infusion, apixaban], scale: 0.8}
    - {pair: [metoprolol, digoxin], scale: 0.4}
    - {pair: [lisinopril, losartan], scale: 0.8}
    - {pair: [sertraline, lorazepam], scale: 0.3}
