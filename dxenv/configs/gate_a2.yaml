# GATE A2 -- an AMENDMENT to gate_a.yaml, recorded rather than edited in place.
#
# gate_a.yaml says: "DO NOT EDIT THIS FILE AFTER RESULTS EXIST. If a threshold turns out
# to be wrong, record a NEW gate with the reasoning for the change, and report both."
# This is that file. gate_a.yaml is unchanged and both are reported.
version: 1
amends: gate_a.yaml
registered_utc: "2026-08-18"

reason_for_amendment: >
  The blank-baseline criterion in gate_a.yaml was mis-specified, not mis-calibrated.
  It requires F to land within 0.02 of the MAJORITY-CLASS RATE while the declared
  primary metric is BALANCED accuracy. Those have different floors: a prior-predicting
  classifier scores the majority rate under plain accuracy, but 1/n_labels under
  balanced accuracy. With 149 labels the two floors are 0.0381 and 0.0067, so the
  criterion as written can never pass on the metric it was written against, regardless
  of what the environment does.

  This is a specification error, and correcting it does not move the substance: the
  underlying question is "is the blank probe at the prior floor?", and the answer is an
  unambiguous yes on both metrics. NO SUBSTANTIVE THRESHOLD IS CHANGED HERE -- the two
  criteria that decide feasibility (v_minus_f_min and t_minus_v_min) are untouched, and
  both were already met.

  Also added: an explicit minimum for the leakage POSITIVE control. gate_a.yaml asks
  that stripping the label-bearing resources barely moves accuracy, which in this
  pipeline is satisfied trivially because those resources never reach the feature matrix
  at all. A trivially-satisfied leak check is not evidence of no leak. So the probe is
  also run WITH the leaky field included, and is required to gain materially -- an
  ablation that cannot detect a leak it was handed proves nothing.

thresholds:
  # Balanced accuracy floor for a prior-predicting classifier over n labels.
  f_vs_chance_tolerance: 0.02
  # Plain top-1 accuracy floor, which IS the majority-class rate.
  f_vs_majority_tolerance_top1: 0.02
  # The positive control must gain at least this much when the label is handed over.
  leak_control_min_gain: 0.10

unchanged_from_gate_a:
  v_minus_f_min: 0.08
  t_minus_v_min: 0.20
  leak_ablation_max_drop: 0.03
