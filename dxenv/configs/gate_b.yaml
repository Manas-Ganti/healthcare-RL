# GATE B -- Phase 3 cold start. PRE-REGISTERED.
#
# Committed BEFORE the Phase 3 measurement is run. test_gate_b_thresholds_preregistered
# enforces that this file's commit precedes the results file, mechanically, exactly as
# gate_a.yaml is enforced. That enforcement is the only thing that makes this a gate
# rather than a note.
#
# DO NOT EDIT THIS FILE AFTER RESULTS EXIST. If a threshold turns out to be wrong, record
# a NEW gate (gate_b2.yaml) with the reasoning, and report both verdicts.
version: 1
registered_utc: "2026-09-03"

# What is measured, and on what.
#
# 200 patients drawn from the TRAIN split (never eval [I12]), k = 8 samples each, at the
# sampling temperature the GRPO rollouts will use. The budget is drawn from p(B) per
# patient and held fixed across that patient's group, so within-group variance measures
# the policy and not the draw.
protocol:
  n_patients: 200
  k: 8
  temperature: 1.0
  split: train
  budget: sampled_per_patient

# The reward bar a rollout must clear to count as a "pass".
#
# Deliberately specified as a PROCEDURE rather than a number. A number chosen today would
# either be arbitrary or would be reverse-engineered from a pilot run, and the second is
# pre-registration in name only. The vitals-only Bayes baseline is a fixed, deterministic
# reference computed on the same patients under the same reward config: it is what an
# agent gets for using every free observation optimally and ordering nothing. Clearing it
# means the tests bought something.
pass_bar:
  rule: mean_total_reward_of_vitals_only_bayes_baseline_on_the_same_patients
  policy: dxenv.policy.baselines.VitalsOnlyPolicy

thresholds:
  # RLVR sharpens behaviour the model already samples sometimes; it cannot manufacture
  # behaviour that never appears. If pass@8 is not clearly above pass@1, there is nothing
  # for GRPO to sharpen and the run will look like it is training while going nowhere.
  pass_at_8_minus_pass_at_1_min: 0.15

  # Zero spread -> zero advantage -> no gradient. This is measured as the mean, across
  # groups, of the within-group reward standard deviation.
  mean_group_reward_std_min: 0.05

  # And the tail matters more than the mean: a run where a third of groups are degenerate
  # trains on two-thirds of its batch.
  max_fraction_degenerate_groups: 0.25
  degenerate_group_std: 0.01

  # Calibration survived cold start. The model's own reported distribution must Brier-score
  # BETTER than the same distribution collapsed onto its argmax. A model that has learned
  # to say 0.99 scores better collapsed, and that is the failure this catches.
  calibration_margin_min: 0.05

  # Headroom below the ceiling. No headroom means either the task is saturated or the
  # ceiling is wrong, and the second is far more likely.
  headroom_below_expected_ceiling_min: 0.10

  # Format is handled by constrained decoding, so this is not a target to train toward --
  # it is a check that the grammar was actually applied.
  schema_valid_fraction_min: 1.0

on_failure:
  pass_at_8_not_above_pass_at_1: >
    Do NOT proceed to GRPO. Either the base model cannot sample the behaviour at all --
    in which case SFT is required, run the teacher and rejection-sampling pipeline and
    re-measure -- or the pass bar is being cleared by every sample, in which case the
    patients are too easy and the sweep should move to a harder mix. Check which by
    reporting pass@1 and pass@8 separately before touching anything.
  group_variance_below_floor: >
    Raise the sampling temperature first and re-measure; the cheapest cause is a
    temperature that collapses the policy onto one action. If variance stays low at
    higher temperature the policy is degenerate and SFT has over-trained -- reduce epochs
    or LR and rebuild the reference. Do NOT compensate by scaling advantages.
  calibration_did_not_survive: >
    The SFT targets have collapsed toward one-hot. Verify that soft labels are recomputed
    from the Bayes posterior over VISIBLE evidence (policy/sft.soft_label_wire) rather
    than copied from the demonstrator, and check SFTDataset.mean_target_entropy against
    its floor. This is the failure mode CLAUDE.md 8.4 exists to prevent; it is not
    something to fix downstream with a calibration head.
  no_headroom_below_ceiling: >
    Treat as a suspected leak before treating it as success. Run the audit suite
    (eval/audit.py) and the counterfactual and leakage-ablation probes specifically. A
    policy at the ceiling on a task with a 149-label flat taxonomy is not a result, it is
    a symptom.
  schema_invalid_output: >
    The grammar was not applied to that call. Fix the backend. Do not add a repair path,
    a retry, or a fallback action -- each of those converts a loud, findable bug into a
    quiet distributional shift in the training data.
