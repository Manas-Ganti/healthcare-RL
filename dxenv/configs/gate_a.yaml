# GATE A -- Phase 0 feasibility. PRE-REGISTERED.
#
# These thresholds are committed BEFORE the Phase 0 probe is run. A threshold chosen
# after seeing the result is not a threshold. test_gate_a_thresholds_preregistered
# enforces that this file's commit precedes the results file mechanically -- that
# enforcement is the only thing that makes this a gate rather than a note.
#
# DO NOT EDIT THIS FILE AFTER RESULTS EXIST. If a threshold turns out to be wrong,
# record a NEW gate (gate_a2.yaml) with the reasoning for the change, and report both.
version: 1
registered_utc: "2026-08-18"

probes:
  F: blank record, no observation at all
  V: demographics, vitals, presenting complaint; no test results
  T: V plus every analyte in the record

# Measured as balanced accuracy over the frozen flat label set, and additionally as mean
# weighted Brier, on a held-out 20% of the Phase 0 corpus.
metric: balanced_accuracy
secondary_metric: mean_weighted_brier

thresholds:
  # V must beat the blank-record floor by a clear margin, or vitals and complaint carry
  # nothing and the agent has no starting point.
  v_minus_f_min: 0.08

  # THE SIZE OF THE ENTIRE PRIZE. If tests buy only a few points over vitals alone, the
  # reward signal is that many points wide and the policy gradient is buried in noise.
  # This is the threshold that decides whether the project is viable.
  t_minus_v_min: 0.20

  # Leakage check. Stripping the label-bearing resources must barely move accuracy. If it
  # collapses, everything above was measuring leakage, not diagnosis.
  leak_ablation_max_drop: 0.03

  # F must sit near the majority-class rate; materially above it means the "blank" probe
  # is not blank.
  f_vs_majority_tolerance: 0.02

on_failure:
  t_minus_v_below_threshold: >
    Do NOT lower the threshold. Harden the cohort first: comorbid patients, ambiguous
    presentations, thinner initial observation, and a wider severity mix. Synthea's
    modules generate labs with unrealistically clean separation from the condition, so
    the expected failure is T ~= V from the OTHER direction -- V already too strong.
    Re-run. If a second hardening pass does not open the gap, shelve the project and
    write up why; a reward signal narrower than rollout noise cannot be trained on.
  v_minus_f_below_threshold: >
    The initial observation is too thin. Widen the presenting-complaint vocabulary and
    check that vitals actually vary with condition before touching anything else.
  leak_ablation_drop_exceeded: >
    Treat as a leak, not a tuning problem. Find the channel in env/filter.py before any
    other number from this phase is reported or believed.
