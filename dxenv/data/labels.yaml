# Fixed FLAT diagnostic label set for dxenv.
#
# FLATNESS IS LOAD-BEARING (CLAUDE.md 6.1): no label may be an ancestor of another,
# because hierarchy lets an agent hedge upward and collect partial credit everywhere.
#
# Fields
#   slug     : stable identifier. Never renamed; the frozen label-set hash covers it.
#   display  : human-readable name. Used by the leak scrubber.
#   system   : organ-system grouping. Reporting/stratification ONLY -- it is deliberately
#              NOT a scoring hierarchy. Nothing in reward/ may read this field.
#   urgency  : severity tier 1-4, see dxenv/configs/severity.yaml for the rationale.
#              1 benign/chronic-stable | 2 needs treatment | 3 urgent | 4 emergent
#   prior    : UNNORMALISED prevalence weight. Normalised at load time.
#   synonyms : alternative surface forms. Used by the observation leak scrubber and by
#              test_no_label_string_in_observation. Under-listing a synonym is how a leak
#              survives the test suite -- add aggressively, this list is a safety net.
#
# SNOMED codes live in snomed_map.yaml, NOT here, so that the label set can be frozen
# independently of terminology-release churn.

