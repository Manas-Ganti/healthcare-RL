# CLAUDE.md 11: the fast suite runs on every commit; the full suite runs nightly and
# before every gate. Both are here, because a gate that nothing runs is a note, and a
# slow test that nothing runs is a slow test someone will eventually delete.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Nightly, 04:00 UTC: the corpus-wide invariant sweeps and the toy-MDP policy-
    # invariance check. These are the tests that catch a leak in 2% of patients, which
    # is why they run over the full corpus and not a sample.
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  fast:
    name: fast suite + lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The pre-registration tests compare git commit timestamps of a gate config
          # against its results file. A shallow clone has neither history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check dxenv tests scripts
      - name: mypy --strict
        run: mypy
      - name: fast suite
        run: pytest -q

  full:
    name: full suite (corpus-wide)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: full suite
        run: pytest -q -m "slow or not slow"
